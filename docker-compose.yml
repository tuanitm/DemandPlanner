version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: dp-redis
    networks:
      - shared-network
      - default
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dp-backend
    networks:
      - shared-network
      - default
    environment:
      DATABASE_URL: mysql+aiomysql://planner:planner%402026@192.168.30.91:3386/demandplanner
      DATABASE_URL_SYNC: mysql+pymysql://planner:planner%402026@192.168.30.91:3386/demandplanner
      REDIS_URL: redis://dp-redis:6379/0
      SECRET_KEY: demand-planner-secret-key-change-in-production
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dp-celery
    networks:
      - shared-network
      - default
    environment:
      DATABASE_URL: mysql+aiomysql://planner:planner%402026@192.168.30.91:3386/demandplanner
      DATABASE_URL_SYNC: mysql+pymysql://planner:planner%402026@192.168.30.91:3386/demandplanner
      REDIS_URL: redis://dp-redis:6379/0
      SECRET_KEY: demand-planner-secret-key-change-in-production
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info --pool=solo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dp-frontend
    networks:
      - default
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

networks:
  shared-network:
    external: true
